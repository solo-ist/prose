# Dependabot version updates. Security *alerts* only ever fire on the default
# branch (main); this file adds scheduled version-update PRs on top of them.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm_and_yarn:
        applies-to: security-updates
        patterns: ["*"]
      # One weekly PR for every minor/patch bump; majors still arrive one per PR.
      minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # TipTap 2→3 is its own migration project (#866) — never a dependency-pass rider.
      - dependency-name: "@tiptap/*"
        update-types: ["version-update:semver-major"]
      # markdown-it 15 requires linkify-it 6 (our override pins <6) and
      # prosemirror-markdown / tiptap-markdown declare ^14 — PR #961 broke the build on it.
      - dependency-name: markdown-it
        versions: [">=15"]
      # tiptap-footnotes 3 peers on TipTap 3 — rides with the TipTap migration (#866).
      - dependency-name: tiptap-footnotes
        update-types: ["version-update:semver-major"]
      # @vitejs/plugin-react 6 peers on Vite 8 (Rolldown); electron-vite 5 is on Vite 7.
      # Comes with a Vite 8 / electron-vite upgrade, not on its own.
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /gateway
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
