name: CI Gate

on:
  workflow_run:
    workflows: ["E2E Tests"]
    types: [completed]

jobs:
  trigger-review:
    # E2E passed on a PR → trigger auto-review via /review comment
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Get PR number
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            // Same-repo PRs populate workflow_run.pull_requests directly.
            // Fork PRs do NOT — GitHub omits them from that array. Fall back
            // to a SHA search so auto-review still triggers for fork contributors.
            const prs = context.payload.workflow_run.pull_requests;
            if (prs && prs.length > 0) {
              core.setOutput('number', prs[0].number);
              return;
            }
            const headSha = context.payload.workflow_run.head_sha;
            const { data } = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} type:pr sha:${headSha}`,
            });
            if (data.items.length === 0) {
              core.info(`No PR found for head SHA ${headSha}`);
              return;
            }
            core.setOutput('number', data.items[0].number);

      - name: Check for duplicate or recent review
        if: steps.pr.outputs.number
        id: dedup
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Fetch recent comments and check for dedup/debounce
          COMMENTS=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq '[.[] | select(.body | contains("<!-- ci-gate-sha:")) | {body, created_at}]')

          # 383-1: SHA dedup — skip if this commit was already reviewed
          SHA_EXISTS=$(echo "$COMMENTS" | jq --arg sha "$HEAD_SHA" \
            '[.[] | select(.body | contains("<!-- ci-gate-sha: " + $sha))] | length')
          if [ "$SHA_EXISTS" -gt 0 ]; then
            echo "::notice::SHA $HEAD_SHA already reviewed — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 383-3: Debounce — skip if a /review was posted within the last 10 minutes
          LATEST=$(echo "$COMMENTS" | jq -r 'sort_by(.created_at) | last | .created_at // empty')
          if [ -n "$LATEST" ]; then
            LATEST_TS=$(date -d "${LATEST}" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%SZ" "${LATEST}" +%s 2>/dev/null || echo 0)
            NOW_TS=$(date +%s)
            DIFF=$(( NOW_TS - LATEST_TS ))
            if [ "$DIFF" -lt 600 ]; then
              echo "::notice::Last /review was ${DIFF}s ago (< 600s) — debouncing"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Check PR author trust
        id: trust
        if: steps.pr.outputs.number && steps.dedup.outputs.skip != 'true'
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        with:
          script: |
            // Only trusted PR authors (repo write/admin) trigger the Anthropic-spending
            // auto-review. A fork PR from an untrusted author is skipped here even though
            // E2E ran — the /review below is posted as the PROJECT_TOKEN owner (always
            // trusted), so the PR *author* must be checked.
            // Do NOT use pr.author_association: GITHUB_TOKEN cannot see *private* org
            // membership, so it reports an org MEMBER as 'CONTRIBUTOR' and the legit chain
            // silently breaks. getCollaboratorPermissionLevel reflects effective repo
            // permission (incl. org/team grants) reliably. See SKILL.md "Author Trust Gating".
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PR_NUMBER),
            });
            const author = pr.user.login;
            let permission = 'none';
            try {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: author,
              });
              permission = data.permission;
            } catch (err) {
              if (err.status !== 404) throw err;  // 404 = not a collaborator → untrusted
            }
            const trusted = ['admin', 'write'].includes(permission);
            core.setOutput('trusted', String(trusted));
            core.setOutput('permission', permission);
            if (!trusted) {
              core.notice(`PR #${process.env.PR_NUMBER} author '${author}' permission='${permission}' — skipping auto-review (untrusted)`);
            }

      - name: Trigger auto-review
        if: steps.pr.outputs.number && steps.dedup.outputs.skip != 'true' && steps.trust.outputs.trusted == 'true'
        env:
          # PROJECT_TOKEN required: github.token events don't trigger downstream
          # issue_comment workflows. claude.yml checks body content, not author.
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$REPO" \
            --body "/review <!-- ci-gate-sha: $HEAD_SHA -->

          *Auto-triggered after E2E tests passed.*"

      - name: Notice — auto-review skipped (untrusted author)
        if: steps.pr.outputs.number && steps.dedup.outputs.skip != 'true' && steps.trust.outputs.trusted != 'true'
        run: |
          echo "::notice::Auto-review skipped for PR #${{ steps.pr.outputs.number }}: author permission=${{ steps.trust.outputs.permission }} (need write/admin)"

  e2e-escalate:
    # E2E failed on a PR → post failure summary for human (or Oz agent) to fix.
    # Auto-fix was retired per #737 — no automated fix requests, no automated mutation.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
      actions: read
    steps:
      - name: Get PR info
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const prs = context.payload.workflow_run.pull_requests;
            if (!prs || prs.length === 0) {
              core.setFailed('No PR associated with this workflow run');
              return;
            }
            core.setOutput('number', prs[0].number);
            core.setOutput('head_sha', context.payload.workflow_run.head_sha);

      - name: Check for duplicate escalation
        id: dedup
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          # Skip if we already posted an escalation for this exact SHA
          COUNT=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq "[.[] | select(.body | contains(\"<!-- e2e-escalation-sha: $HEAD_SHA -->\"))] | length")
          if [ "$COUNT" -gt 0 ]; then
            echo "::notice::Escalation already posted for SHA $HEAD_SHA — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get failure logs
        if: steps.dedup.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh run view "$RUN_ID" --repo "$REPO" --log-failed 2>/dev/null | tail -150 > /tmp/test-failures.txt || echo "Could not fetch failure logs" > /tmp/test-failures.txt

      - name: Post escalation notice
        if: steps.dedup.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          RUN_URL="https://github.com/$REPO/actions/runs/$RUN_ID"
          {
            echo "<!-- e2e-escalation-sha: $HEAD_SHA -->"
            echo "## E2E Failure — Human Action Required"
            echo ""
            echo "E2E tests failed on this PR. A human or an Oz agent should investigate and push a fix."
            echo ""
            echo "**[View full run]($RUN_URL)**"
            echo ""
            echo "<details>"
            echo "<summary>Failure log (last 150 lines)</summary>"
            echo ""
            echo '```'
            cat /tmp/test-failures.txt
            echo '```'
            echo "</details>"
          } > /tmp/escalation.md
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file /tmp/escalation.md
          gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label "needs-review"
