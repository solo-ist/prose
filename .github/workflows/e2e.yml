name: E2E Tests

on:
  pull_request:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read

jobs:
  e2e:
    # Only run on PRs, or on /test comments (but not @claude mentions)
    # NOTE: /test comments also trigger web-e2e.yml — this is intentional.
    # Both Electron and web test suites run in parallel on /test.
    if: |
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(github.event.comment.body, '/test') &&
        !contains(github.event.comment.body, '@claude')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The relay spec (e2e/electron.mcp-relay.spec.ts, #1239) runs the real
    # gateway against this Postgres; every other spec ignores it.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prose
          POSTGRES_PASSWORD: prose
          POSTGRES_DB: prose_gateway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prose -d prose_gateway"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check commenter permissions
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v9
        with:
          script: |
            const username = context.payload.comment.user.login;
            let permission;
            try {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username,
              });
              permission = data.permission;
            } catch (err) {
              if (err.status === 404) {
                core.setFailed(`User ${username} lacks write access to this repository (not a collaborator)`);
                return;
              }
              throw err;
            }
            if (!['admin', 'write'].includes(permission)) {
              core.setFailed(`User ${username} lacks write access (permission: ${permission})`);
            }

      - name: Resolve PR ref
        id: pr
        uses: actions/github-script@v9
        with:
          script: |
            if (context.eventName === 'pull_request') {
              core.setOutput('ref', context.payload.pull_request.head.ref);
              core.setOutput('repo', context.payload.pull_request.head.repo.full_name);
            } else {
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.issue.number,
              });
              core.setOutput('ref', pr.head.ref);
              core.setOutput('repo', pr.head.repo.full_name);
            }

      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.pr.outputs.repo }}
          ref: ${{ steps.pr.outputs.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            gateway/package-lock.json

      - run: npm ci

      - name: Install the gateway for the relay spec
        working-directory: gateway
        env:
          DATABASE_URL: postgresql://prose:prose@localhost:5432/prose_gateway?schema=public
        run: |
          npm ci
          npx prisma generate
          npx prisma migrate deploy

      - name: Run unit tests
        run: npm run test:unit

      - name: Install Playwright system deps
        run: npx playwright install --with-deps

      - name: Build Electron app
        run: npm run build

      - name: Run E2E tests
        uses: coactions/setup-xvfb@v1
        env:
          # CI Linux runners lack kernel namespace support for Chrome's sandbox
          ELECTRON_DISABLE_SANDBOX: 1
          # The relay spec's local gateway (#1239). Test-only values for the
          # throwaway CI database; never real credentials.
          PROSE_E2E_GATEWAY_DATABASE_URL: postgresql://prose:prose@localhost:5432/prose_gateway?schema=public
          BETTER_AUTH_SECRET: ci-only-secret-not-for-production-0123456789
        with:
          run: npx playwright test
          options: -screen 0 1280x1024x24

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-results
          path: |
            test-results.json
            test-results/
