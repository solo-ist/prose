name: Pipeline Notifications

on:
  pull_request:
    types: [labeled]

jobs:
  notify:
    # Fire when pipeline labels are applied — regardless of which workflow applied them
    if: contains(fromJSON('["needs-review","complex"]'), github.event.label.name)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Build payload
        id: payload
        env:
          LABEL: ${{ github.event.label.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$LABEL" = "complex" ]; then
            EMOJI="🔴"
            URGENCY="Complex — full human review required"
          else
            EMOJI="🟡"
            URGENCY="Needs review — human attention requested"
          fi

          # Build the JSON with jq, never by pasting values into a heredoc: a PR
          # title with a double quote (#1036's `"Shared"`) produced invalid JSON
          # and failed the Slack step. Slack mrkdwn also needs &, < and >
          # escaped in the link text, or a title like "a <b>" breaks the link.
          jq -n \
            --arg emoji "$EMOJI" \
            --arg number "$PR_NUMBER" \
            --arg title "$PR_TITLE" \
            --arg url "$PR_URL" \
            --arg author "$PR_AUTHOR" \
            --arg label "$LABEL" \
            --arg urgency "$URGENCY" \
            'def mrkdwn: gsub("&"; "&amp;") | gsub("<"; "&lt;") | gsub(">"; "&gt;");
            {
              blocks: [
                { type: "header",
                  text: { type: "plain_text", text: "\($emoji) PR #\($number) needs human review" } },
                { type: "section",
                  fields: [
                    { type: "mrkdwn", text: "*PR:* <\($url)|#\($number) \($title | mrkdwn)>" },
                    { type: "mrkdwn", text: "*Author:* \($author | mrkdwn)" },
                    { type: "mrkdwn", text: "*Label:* `\($label | mrkdwn)`" },
                    { type: "mrkdwn", text: "*Status:* \($urgency)" }
                  ] },
                { type: "context",
                  elements: [
                    { type: "mrkdwn", text: "Pipeline triage routed this PR for human review. Check the PR comments for scorer + PE analysis." }
                  ] }
              ]
            }' > /tmp/slack-payload.json

      - name: Send Slack notification
        uses: slackapi/slack-github-action@v4
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload-file-path: /tmp/slack-payload.json
