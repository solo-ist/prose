# Render Blueprint for the Prose gateway (#1349).
#
# Generated from the live resources ("Generate Blueprint", exported
# 2026-11-24T00:05:01Z) so that adopting them changes nothing: Render matches
# `prose-gateway` and `prose-gateway-db` by name and applies this file to them
# in place. Only comments were added to the export.
#
# ONCE THE BLUEPRINT EXISTS IN RENDER, EVERY CHANGE TO THIS FILE ON `main` IS
# APPLIED TO PRODUCTION AUTOMATICALLY. Treat an edit here like a migration:
#   - `render blueprints validate gateway/render.yaml` before pushing.
#   - A field left out falls back to Render's default, which is rarely the
#     live value. Don't delete a line to "tidy" it.
#   - Environment variables that exist on the service but aren't listed here
#     are kept. Removing a resource from this file does not delete it.
#
# In Render: Blueprint name `prose-gateway`, branch `main`, Blueprint path
# `gateway/render.yaml`.
#
# DNS: the three hostnames are Hover CNAMEs to this service's onrender.com
# target, with Render-managed TLS. No CDN or proxy in front.
version: "1"
projects:
- name: Prose
  environments:
  - name: Production
    services:
    - type: web
      name: prose-gateway
      runtime: docker
      repo: https://github.com/solo-ist/prose
      plan: starter
      # Every value is set in the Render dashboard, never here (`sync: false`):
      # the repo is public, and SHARE_SUBDOMAINS must be togglable without a
      # deploy from the repo. What each one is for: gateway/src/config.ts.
      envVars:
      - key: OPERATOR_EMAIL
        sync: false
      # Per-publication subdomains (#917). On only while the wildcard domain
      # below is live; otherwise the first GET to a label host fails TLS.
      - key: SHARE_SUBDOMAINS
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SHARE_BASE_URL
        sync: false
      - key: NODE_ENV
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: prose-gateway-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      region: virginia
      healthCheckPath: /health
      # Relative to rootDir.
      dockerContext: .
      dockerfilePath: ./Dockerfile
      domains:
      - api.prose.solo.ist
      - share.prose.solo.ist
      - '*.share.prose.solo.ist'
      # Every commit on `main` that touches gateway/ (rootDir) deploys.
      autoDeployTrigger: commit
      rootDir: gateway
    databases:
    - name: prose-gateway-db
      databaseName: prose_gateway_db
      user: prose_gateway_db_user
      plan: basic-256mb
      region: virginia # must match the web service's region
      # Empty on purpose: no connections from outside Render. Queries go
      # through the service shell (docs/web/beta-runbook.md §4).
      ipAllowList: []
      postgresMajorVersion: "16"
      diskSizeGB: 15
